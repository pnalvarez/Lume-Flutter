# Runs on every PR. To block merging until this workflow is green, enable branch
# protection (or a ruleset): Repository Settings → Branches → edit the default
# rule → enable "Require status checks to pass before merging" → add the check
# named "All checks passed" (the final job below).

name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Run unit tests
        run: flutter test test/unit test/core test/app

  ui-tests:
    name: UI tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies (app)
        run: flutter pub get

      - name: Run app widget tests
        run: flutter test test/widget_test.dart

      - name: Install dependencies (design system)
        working-directory: packages/lume_design_system
        run: flutter pub get

      - name: Run design system widget tests
        working-directory: packages/lume_design_system
        run: flutter test

  style:
    name: Style
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies (app)
        run: flutter pub get

      - name: Install dependencies (design system)
        working-directory: packages/lume_design_system
        run: flutter pub get

      - name: Check Dart formatting
        run: |
          mapfile -t files < <(
            git ls-files '*.dart' \
              | grep -vE '\.(g|gr|freezed|config|mocks)\.dart$' \
              | grep -v 'widgetbook.app.directories.g.dart'
          )
          dart format --output=none --set-exit-if-changed "${files[@]}"

      - name: Analyze app
        run: flutter analyze --no-fatal-warnings --no-fatal-infos

      - name: Analyze design system
        working-directory: packages/lume_design_system
        run: flutter analyze --no-fatal-warnings --no-fatal-infos

  architecture:
    name: Architecture
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check layer architecture
        run: bash tool/check_architecture.sh

  ci-required:
    name: All checks passed
    runs-on: ubuntu-latest
    needs: [unit-tests, ui-tests, style, architecture]
    if: always()
    steps:
      - name: Enforce job results
        env:
          UNIT: ${{ needs.unit-tests.result }}
          UI: ${{ needs.ui-tests.result }}
          STYLE: ${{ needs.style.result }}
          ARCH: ${{ needs.architecture.result }}
        run: |
          echo "unit-tests: $UNIT"
          echo "ui-tests: $UI"
          echo "style: $STYLE"
          echo "architecture: $ARCH"
          if [[ "$UNIT" != "success" || "$UI" != "success" || "$STYLE" != "success" || "$ARCH" != "success" ]]; then
            echo "::error::CI did not complete successfully; do not merge."
            exit 1
          fi
          echo "All CI jobs succeeded."
