# Runs on every PR. To block merging until this workflow is green, enable branch
# protection (or a ruleset): Repository Settings → Branches → edit the default
# rule → enable "Require status checks to pass before merging" → add the check
# named "All checks passed" (the final job below).

name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests-and-coverage:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Needed so git can diff this SHA against the PR base / main.
          fetch-depth: 0

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Generate code
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Run unit tests with coverage
        run: flutter test test/unit test/core test/app --coverage

      # Whole-repo coverage is ~50% today; gate only lines changed vs the PR base
      # (or main on push). Empty diffs (no Dart line changes) pass.
      - name: Enforce 80% coverage on changed lines
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            BASE_REF="${{ github.base_ref }}"
            git fetch --no-tags --prune origin "$BASE_REF"
            DIFF_RANGE="origin/${BASE_REF}...HEAD"
          else
            git fetch --no-tags --prune origin main
            DIFF_RANGE="origin/main...HEAD"
          fi
          echo "Diff range: $DIFF_RANGE"
          git diff "$DIFF_RANGE" -- '*.dart' \
            | dart run pull_request_coverage

  ui-tests:
    name: UI tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies (app)
        run: flutter pub get

      - name: Generate code
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Run app widget tests
        run: flutter test test/widget_test.dart

      - name: Install dependencies (design system)
        working-directory: packages/lume_design_system
        run: flutter pub get

      - name: Run design system widget tests
        working-directory: packages/lume_design_system
        run: flutter test

  style:
    name: Style
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies (app)
        run: flutter pub get

      - name: Generate code
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Install dependencies (design system)
        working-directory: packages/lume_design_system
        run: flutter pub get

      - name: Check Dart formatting
        run: |
          mapfile -t files < <(
            git ls-files '*.dart' \
              | grep -vE '\.(g|gr|freezed|config|mocks)\.dart$' \
              | grep -v 'widgetbook.app.directories.g.dart'
          )
          dart format --output=none --set-exit-if-changed "${files[@]}"

      - name: Analyze app
        run: flutter analyze --no-fatal-warnings --no-fatal-infos

      - name: Analyze design system
        working-directory: packages/lume_design_system
        run: flutter analyze --no-fatal-warnings --no-fatal-infos

  architecture:
    name: Architecture
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check layer architecture
        run: bash tool/check_architecture.sh

  build-android:
    name: Build Android
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Generate code
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Build release APK
        run: flutter build apk --release

  build-ios:
    name: Build iOS
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Generate code
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Build release iOS (no codesign)
        run: flutter build ios --release --no-codesign

  build-web:
    name: Build Web
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Generate code
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Build release web
        run: flutter build web --release

  ci-required:
    name: All checks passed
    runs-on: ubuntu-latest
    needs:
      - unit-tests-and-coverage
      - ui-tests
      - style
      - architecture
      - build-android
      - build-ios
      - build-web
    if: always()
    steps:
      - name: Enforce job results
        env:
          UNIT: ${{ needs.unit-tests-and-coverage.result }}
          UI: ${{ needs.ui-tests.result }}
          STYLE: ${{ needs.style.result }}
          ARCH: ${{ needs.architecture.result }}
          ANDROID: ${{ needs.build-android.result }}
          IOS: ${{ needs.build-ios.result }}
          WEB: ${{ needs.build-web.result }}
        run: |
          echo "unit-tests-and-coverage: $UNIT"
          echo "ui-tests: $UI"
          echo "style: $STYLE"
          echo "architecture: $ARCH"
          echo "build-android: $ANDROID"
          echo "build-ios: $IOS"
          echo "build-web: $WEB"
          if [[ "$UNIT" != "success" || "$UI" != "success" || "$STYLE" != "success" || "$ARCH" != "success" || "$ANDROID" != "success" || "$IOS" != "success" || "$WEB" != "success" ]]; then
            echo "::error::CI did not complete successfully; do not merge."
            exit 1
          fi
          echo "All CI jobs succeeded."
